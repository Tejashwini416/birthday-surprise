<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Birthday Slides</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     SLIDE 1
     ========================= -->

<div class="slide active" id="slide1">

    <h1>Ika modalu pedadama?</h1>

    <img
        src="https://media1.tenor.com/m/AeBSVGFSvNEAAAAC/arambikalangala-kamal-haasan.gif"
        class="intro-image"
        alt="Cute birthday GIF"
    >

    <div class="button-area">

        <button class="btn" onclick="goToSlide(2)">
            YES
        </button>

        <button class="btn" onclick="goToSlide(3)">
            NO
        </button>

    </div>

</div>


<!-- =========================
     SLIDE 2
     ========================= -->

<div class="slide" id="slide2">

    <h1>Choodadaniki ready aa?</h1>

    <img
        src="https://media.tenor.com/nb9yRj8rHo4AAAAM/excited-ah.gif"
        class="slide2-sticker"
        alt="Excited sticker"
    >

    <button class="btn" onclick="goToSlide(4)">
        YES
    </button>

</div>


<!-- =========================
     SLIDE 3
     ========================= -->

<div class="slide" id="slide3">

    <h1>NO aa? </h1>

    <img
        src="https://media1.tenor.com/m/x6pI8oubxFIAAAAd/narukutharu-bramhi.gif"
        class="ticker-image"
        alt="Try again"
    >

    <button class="btn" onclick="goToSlide(1)">
        Urike choice icha… NO option ledu😏 
    </button>

</div>


<!-- =========================
     SLIDE 4
     ========================= -->

<div class="slide" id="slide4">

    <img
        src="https://media1.tenor.com/m/_T5kHIFvAtwAAAAC/happy-birthday-trump.gif"
        class="meme-sticker"
        alt="Birthday meme"
    >

</div>


<!-- =========================
     SLIDE 5
     ========================= -->

<div class="slide" id="slide5">

    <h1>Birthday Girl kosam Sangeetha Seva Prarambham...🎵</h1>

    <img
        src="https://media1.tenor.com/m/oZYB4Du9LX8AAAAC/sayaji-shinde-sayajishinde.gif"
        class="meme-sticker"
        alt="Birthday song meme"
    >

</div>


<!-- =========================
     SLIDE 6
     ========================= -->

<div class="slide" id="slide6">

    <h1>Tisuko birthday roju pandaga chesuko</h1>

    <img
        src="https://media1.tenor.com/m/N_asZvQYQhkAAAAd/teesko-pandaga-chesko-brahmi.gif"
        class="meme-sticker"
        alt="Birthday meme"
    >

</div>


<!-- =========================
     SLIDE 7 - SISTER
     ========================= -->

<div class="slide" id="slide7">

 

    <p>
        Dear chinni, Happy Birthday! ❤️
        <br><br>
        Thank you for being my biggest supporter,
        my partner in crime, and the person I can always count on.
    </p>

</div>


<!-- =========================
     SLIDE 8 - REPLAY
     ========================= -->

<div class="slide" id="slide8">

    <img
        src="https://media.tenor.com/6M7XGSAksDEAAAAM/karan.gif"
        class="replay-sticker"
        alt="Birthday sticker"
    >

</div>


<script src="script.js"></script>

</body>
</html>
